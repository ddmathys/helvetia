<title>Helvetia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout : carte plein écran façon « atlas de nuit ». En haut l'année et le compteur d'habitants, en bas le curseur du temps découpé en époques.
   Les fiches s'ouvrent en panneau à droite (bureau) ou en feuille depuis le bas (téléphone). Thème sombre assumé, pour faire briller les territoires. */
:root{
  --bg:#0c131b; --bg2:#121c27; --panel:#16212d; --ink:#eef2f5; --muted:#8b9bac; --line:#26364a;
  --membre:#e2453c; --allie:#e8a33d; --sujet:#a35c8c; --etranger:#253446; --helv:#3f9a6e; --fr:#4a6fc7;
  --lake:#16324a; --gold:#f2c46d;
  --display:"Instrument Serif",Georgia,serif; --ui:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;display:flex;flex-direction:column}
#map{flex:1;min-height:0;position:relative;background:radial-gradient(90% 70% at 50% 45%,#13202d,var(--bg) 75%)}
#map svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map svg:active{cursor:grabbing}

/* en-tête flottant */
.head{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 30px;pointer-events:none;background:linear-gradient(var(--bg) 0,rgba(12,19,27,.75) 55%,transparent)}
.when{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand{font-size:.72rem;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.year{font-family:var(--display);font-size:clamp(2.6rem,9vw,3.6rem);line-height:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
.year small{font-size:.42em;color:var(--muted);margin-left:6px;font-style:italic}
.era{font-size:.88rem;font-weight:700;color:var(--gold);max-width:22ch}
.pop{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pop .lbl{font-size:.72rem;font-weight:700;color:var(--muted)}
.pop .num{font-family:var(--display);font-size:clamp(1.9rem,7vw,2.6rem);line-height:.95;font-variant-numeric:tabular-nums}
.chip{font-size:.66rem;font-weight:800;border-radius:99px;padding:2px 8px;background:var(--line);color:var(--muted)}
.chip.real{background:rgba(226,69,60,.18);color:#ff9a92}
.cantons{font-size:.8rem;font-weight:700;color:var(--muted);margin-top:4px}
.cantons b{color:var(--ink);font-variant-numeric:tabular-nums}

/* carte */
.cant{stroke:#0c131b;stroke-width:.8;vector-effect:non-scaling-stroke;transition:fill .55s ease;cursor:pointer}
.cant:hover{filter:brightness(1.18)}
.selout{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}
.border.ghost{stroke-dasharray:5 4;opacity:.7}
.lake{cursor:pointer}.lake:hover{fill:#1d4466}
.lakelab text{font-family:var(--display);font-style:italic;fill:#9fc6e6;text-anchor:middle;paint-order:stroke;stroke:var(--bg);pointer-events:none}
.lakelab .la{font-family:var(--ui);font-style:normal;font-weight:700;fill:#6f97b8}
.flash{fill:none;stroke:#ffd9a0;stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none;animation:flash 1.6s ease-out forwards}
@keyframes flash{0%{opacity:1;stroke-width:6}100%{opacity:0;stroke-width:1}}
.border{fill:none;stroke:#5c7189;stroke-width:1.2;vector-effect:non-scaling-stroke;pointer-events:none}
.lake{fill:var(--lake);stroke:#24506f;stroke-width:.6;vector-effect:non-scaling-stroke}
.mtn{pointer-events:none}
.clabel{font-family:var(--ui);font-weight:800;fill:rgba(238,242,245,.78);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(12,19,27,.6);stroke-width:2px}
.ev .sword{display:none}
.ev.battle .dot{display:none}.ev.battle .sword{display:inline}
.sword circle{fill:#3a1410;stroke:#ff6a4d;stroke-width:2;vector-effect:non-scaling-stroke}
.sword path{fill:none;stroke:#ffd9c9;stroke-width:2.2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ev.battle.old .sword{opacity:.6}
.ev:hover .sword circle{fill:#5a1d16}
.city{cursor:pointer}.city .hit{fill:transparent}.city .pt{fill:var(--ink)}
.war{background:rgba(255,106,77,.08);border:1px solid rgba(255,106,77,.35);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.war .wname{font-family:var(--display);font-size:1.2rem;color:#ffb8a6}
.war .sides{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-weight:700;font-size:.88rem}
.war .sides b{font-size:.7rem;color:var(--muted);font-weight:800}
.war .sides span:last-child{text-align:right}
.war .win{font-size:.85rem;color:var(--muted)}.war .win strong{color:var(--ink)}
.city text{font-family:var(--ui);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}

.peak text{font-family:var(--display);font-style:italic;fill:#c9d6e2;paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
.ev{cursor:pointer}
.ev .ring{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.ev .ring{transform-box:fill-box;transform-origin:center}
.ev .dot{stroke:#0c131b;stroke-width:1.2;vector-effect:non-scaling-stroke}
.ev.old .dot{opacity:.55}

/* dock du temps */
.dock{position:relative;z-index:6;background:var(--bg2);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;font-weight:700;color:var(--muted);min-height:18px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.row{display:flex;align-items:center;gap:12px}
.play{flex:0 0 46px;height:46px;border-radius:50%;border:0;background:var(--gold);color:#241a05;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(242,196,109,.25)}
.play:focus-visible,.btn:focus-visible,.zbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.track{position:relative;flex:1;min-width:0;height:46px}
.bands{position:absolute;left:0;right:0;top:15px;height:16px;display:flex;border-radius:8px;overflow:hidden}
.bands div{height:100%;border-right:1px solid var(--bg2)}
.ticks{position:absolute;left:0;right:0;top:9px;height:28px;pointer-events:none}
.ticks i{position:absolute;top:0;width:2px;height:6px;border-radius:1px;background:var(--ink);opacity:.6;transform:translateX(-1px)}
input[type=range]{position:absolute;inset:0;width:100%;height:46px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:46px;background:transparent}
input[type=range]::-moz-range-track{height:46px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:40px;margin-top:3px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 3px rgba(12,19,27,.8),0 0 18px rgba(255,255,255,.5)}
input[type=range]::-moz-range-thumb{width:6px;height:40px;border:0;border-radius:3px;background:var(--ink);box-shadow:0 0 0 3px rgba(12,19,27,.8),0 0 18px rgba(255,255,255,.5)}
input[type=range]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.eralbl{position:relative;height:14px;font-size:.62rem;font-weight:700;color:var(--muted)}
.eralbl span{position:absolute;top:0;white-space:nowrap;transform:translateX(-50%)}

/* zoom */
.zoom{position:absolute;right:14px;bottom:14px;z-index:4;display:flex;flex-direction:column;gap:6px}
.zbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(18,28,39,.9);color:var(--ink);font-size:1.15rem;font-weight:700;cursor:pointer}
.hint{position:absolute;left:16px;bottom:14px;z-index:4;font-size:.75rem;font-weight:600;color:var(--muted);max-width:60%}

/* toast d'événement */
.toast{position:absolute;left:50%;top:118px;z-index:7;transform:translateX(-50%);background:rgba(22,33,45,.96);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 14px;max-width:min(420px,88vw);box-shadow:0 14px 40px rgba(0,0,0,.45);animation:tin .35s ease-out;pointer-events:none}
.toast b{display:block;font-family:var(--display);font-size:1.25rem;line-height:1.1}
.toast span{font-size:.8rem;color:var(--muted);font-weight:600}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

/* panneau */
.panel{position:absolute;z-index:8;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
@media (min-width:900px){.panel{right:16px;top:16px;bottom:16px;width:360px;border-radius:18px;transform:translateX(calc(100% + 24px))}.panel.open{transform:none}}
@media (max-width:899px){.panel{left:0;right:0;bottom:0;max-height:62%;border-radius:20px 20px 0 0;transform:translateY(105%)}.panel.open{transform:none}}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 16px 10px}
.ptop .k{font-size:.72rem;font-weight:800;color:var(--gold)}
.ptop h2{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:2rem;line-height:1}
.close{flex:0 0 34px;height:34px;border-radius:50%;border:0;background:var(--line);color:var(--ink);cursor:pointer;font-size:1rem}
.pbody{overflow:auto;padding:0 16px 18px;display:flex;flex-direction:column;gap:14px}
.pbody p{margin:0;line-height:1.6;color:#d3dbe3;font-size:.95rem}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--bg2);border-radius:10px;padding:10px}
.fact small{display:block;font-size:.68rem;font-weight:700;color:var(--muted)}
.fact b{font-size:.95rem;font-variant-numeric:tabular-nums}
.sub{font-size:.75rem;font-weight:800;color:var(--muted);margin-top:4px}
.hist{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:5px}
.hist div{position:relative;padding:3px 0 7px 14px;font-size:.86rem;color:var(--muted)}
.hist div::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:3px;background:var(--c)}
.hist div.now{color:var(--ink);font-weight:700}
.hist b{font-variant-numeric:tabular-nums;color:var(--ink);margin-right:6px}
.evlist{display:flex;flex-direction:column;gap:6px}
.btn{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 11px;cursor:pointer;font:inherit;font-size:.88rem}
.btn b{font-variant-numeric:tabular-nums;color:var(--gold);flex:0 0 auto}
.btn.future{opacity:.45}
.portrait{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.portrait svg{width:min(190px,52vw);height:auto;filter:drop-shadow(0 12px 24px rgba(0,0,0,.4))}
.portrait figcaption{font-size:.74rem;color:var(--muted);text-align:center;font-style:italic;max-width:30ch}
.know{background:linear-gradient(135deg,rgba(242,196,109,.14),rgba(242,196,109,.04));border:1px solid rgba(242,196,109,.3);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.know span{font-family:var(--display);font-size:1.15rem;color:var(--gold)}
.see{margin:0;padding-left:18px;color:#d3dbe3;font-size:.9rem;line-height:1.7}
.see li::marker{color:var(--gold)}
.ident{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:.88rem}
.ident dt{color:var(--muted);font-weight:700}.ident dd{margin:0;color:#d3dbe3}
.src{font-size:.78rem;color:var(--muted)}
.src a{color:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:800;color:var(--muted)}
.tag i{width:10px;height:10px;border-radius:50%;display:inline-block}
.credit{position:absolute;right:62px;bottom:16px;z-index:4;font-size:.62rem;color:#5d6f82}
@media (max-width:640px){.credit{display:none}.hint{max-width:70%}}
@media (prefers-reduced-motion:reduce){.ev .ring{animation:none;opacity:0}.cant{transition:none}}
</style>

</div>

  g.push(`<path d="M24 220 C30 172 62 152 100 150 C138 152 170 172 176 220Z" fill="${f.pattern?'url(#chk)':f.garment}"/>`);
  if(f.cloak)g.push(`<path d="M22 220 C26 178 52 158 80 152 L70 220Z" fill="${f.cloak}"/><path d="M178 220 C174 178 148 158 120 152 L130 220Z" fill="${f.cloak}"/>`);
  if(f.fur)g.push(`<path d="M40 176 C60 160 80 156 100 156 C120 156 140 160 160 176 L156 184 C138 170 120 166 100 166 C80 166 62 170 44 184Z" fill="${f.cloak}" stroke="rgba(0,0,0,.25)" stroke-width="2" stroke-dasharray="2 3"/>`);
  if(f.fibula)g.push(`<circle cx="78" cy="168" r="6" fill="#e0b34a"/><circle cx="78" cy="168" r="2.5" fill="#8a6a2a"/>`);
  if(f.buckle)g.push(`<rect x="86" y="198" width="28" height="18" rx="4" fill="#c9c9c9"/><path d="M92 204h16M92 210h16" stroke="#8a6a2a" stroke-width="2"/>`);

  g.push(`<circle cx="89" cy="101" r="2.8" fill="#24180f"/><circle cx="111" cy="101" r="2.8" fill="#24180f"/><path d="M83 93 Q89 90 95 93M105 93 Q111 90 117 93" stroke="${hc}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`);
  g.push(`<path d="M100 104 L97 114 L102 114" stroke="rgba(0,0,0,.25)" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M94 122 Q100 125 106 122" stroke="#8a4a3a" stroke-width="2" fill="none" stroke-linecap="round"/>`);
  if(f.beard==='full'||f.beard==='long')g.push(`<path d="M71 104 C70 ${f.beard==='long'?158:138} 92 ${f.beard==='long'?168:148} 100 ${f.beard==='long'?170:148} C108 ${f.beard==='long'?168:148} 130 ${f.beard==='long'?158:138} 129 104 C124 118 116 126 100 126 C84 126 76 118 71 104Z" fill="${hc}"/><path d="M92 121 Q100 118 108 121" stroke="#8a4a3a" stroke-width="2" fill="none"/>`);
  if(f.beard==='mustache'||f.beard==='full'||f.beard==='long')g.push(`<path d="M86 120 C92 114 108 114 114 120 C116 126 118 132 116 136 C112 128 106 122 100 122 C94 122 88 128 84 136 C82 132 84 126 86 120Z" fill="${hc}"/>`);

  if(f.hair==='long'||f.hair==='braid')g.push(`<path d="M68 104 C62 62 138 62 132 104 C124 84 112 78 100 78 C88 78 76 84 68 104Z" fill="${hc}"/>`);

  if(f.hat==='spangen')g.push(`<path d="M66 98 C64 54 136 54 134 98Z" fill="${hcC}"/><path d="M100 58v40M70 80 C86 74 114 74 130 80" stroke="#c9a04a" stroke-width="4" fill="none"/><rect x="64" y="94" width="72" height="7" rx="3" fill="#c9a04a"/>`);
  if(f.hat==='mitre')g.push(`<path d="M74 82 L76 40 L100 26 L124 40 L126 82 C112 76 88 76 74 82Z" fill="${hcC}"/><path d="M100 28v52M77 58 C90 54 110 54 123 58" stroke="#e0b34a" stroke-width="4" fill="none"/>`);

  g.push(`</g><circle cx="100" cy="110" r="99" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/>`);
  return `<svg viewBox="0 0 200 220" role="img" aria-label="Portrait illustré">${g.join('')}</svg>`;
}

/* Montagnes : petits sommets semés dans les régions alpines (graine fixe) */
const ALP={UR:99,GR:99,VS:99,GL:99,OW:99,NW:99,AI:99,TI:46.15,BE:46.72,VD:46.45,FR:46.62,LU:46.95,SZ:47.06,SG:47.2,AR:47.38};
function drawMountains(){
  let s=7;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
  const pts=[];const alp=cantons.filter(f=>ALP[f.code]);
  for(let i=0;i<5200&&pts.length<520;i++){const lon=5.95+rnd()*4.55,lat=45.82+rnd()*2.0;
    for(const f of alp){const lim=ALP[f.code];const ok=f.code==='TI'?lat>lim:lat<lim;if(ok&&d3.geoContains(f,[lon,lat])){pts.push([lon,lat,.6+rnd()*.7]);break}}}
  pts.sort((a,b)=>b[1]-a[1]);
  gMtn.selectAll('g').data(pts).join(enter=>{const g=enter.append('g');g.append('path').attr('class','m1');g.append('path').attr('class','m2');return g})

/* Une entité = tous les cantons actuels qui ont le même maître à cette date, fusionnés en une seule forme */
const GEOMS=TOPO.objects.cantons.geometries;
function entityOf(code,y){if(y<1291){const p=preAt(code,y);return{key:'p|'+p.key,label:p.key==='all'?'':p.label,fill:p.color,status:null}}
  const s=statusAt(code,y);return{key:s[1]+'|'+s[2],label:s[2],fill:fillFor(s[1]),status:s[1]}}
function biggestPart(g){if(g.type==='Polygon')return g;let best=null,ba=-1;for(const c of g.coordinates){const poly={type:'Polygon',coordinates:c};const a=d3.geoArea(poly);if(a>ba){ba=a;best=poly}}return best}
let ENTS=[];
function drawEntities(pre){

  ENTS=[...groups.values()].map(g=>{const geom=topojson.merge(TOPO,GEOMS.filter(x=>g.ids.includes(x.id)));const part=biggestPart(geom);return{...g,feature:{type:'Feature',geometry:geom},c:path.centroid(part),area:path.area(part)}});
  gEnt.selectAll('path').data(ENTS,d=>d.key).join(e=>e.append('path').attr('class','cant').style('opacity',0).call(x=>x.transition().duration(450).style('opacity',1)))
    .attr('d',d=>path(d.feature)).attr('fill',d=>d.fill)
    .on('click',(ev,d)=>{ev.stopPropagation();const[x,y]=d3.pointer(ev,gEnt.node());const ll=proj.invert([x,y]);const f=cantons.find(c=>d3.geoContains(c,ll))||cantons.find(c=>d.codes.includes(c.code));openCanton(f)});
  gLab.selectAll('text').data(ENTS.filter(d=>d.label),d=>d.key).join('text').attr('class','clabel').attr('x',d=>d.c[0]).attr('y',d=>d.c[1]+3).text(d=>d.label.split(/ \(|, /)[0]);
  const sel=selCode?cantons.find(c=>c.code===selCode):null;
  gSel.selectAll('path').data(sel?[sel]:[]).join('path').attr('class','selout').attr('d',path);
  scaleMarks();
}
function lakeName(id,y){const L=LAKES[id];if(!L)return null;let n=null;for(const[a,nm]of L.names)if(y>=a)n=nm;return n}

   .attr('transform',d=>{const[x,y]=proj([d.lon,d.lat]);return `translate(${x},${y})`})
   .classed('old',d=>!d.recent).classed('battle',d=>d.type==='bat')
   .call(g=>{g.select('.dot').attr('fill',d=>TYPES[d.type][1]).attr('r',d=>dotR(d));g.select('.ring').attr('stroke',d=>TYPES[d.type][1]).style('display',d=>d.recent?null:'none')});

const MAJOR=new Set(['Genève','Genava','Zurich','Turicum','Berne','Bâle','Basilia','Lugano','Lausanne','Augusta Raurica','Aventicum','Coire','Saint-Gall']);
const swS=d=>(d.recent?.95:.7)*(d.lvl===1?1:.85)/Math.pow(K,.85);
const dotR=d=>(d.recent?6.5:4)*(d.lvl===1?1:.85)/Math.pow(K,.85);

  gCity.selectAll('g.city').select('circle.pt').attr('r',2.6/K);gCity.selectAll('g.city').select('circle.hit').attr('r',9/K);
  gCity.selectAll('g.city').select('text').style('display',d=>K<(W()<600?2.6:1.7)&&!MAJOR.has(d.n)?'none':null).attr('x',5/K).attr('y',4/K).style('font-size',(11.5/K)+'px').style('stroke-width',(3/K)+'px');
  gMtn.selectAll('g').attr('transform',d=>{const[x,y]=proj([d[0],d[1]]);return `translate(${x},${y}) scale(${d[2]/Math.pow(K,.75)})`});

  gLab.selectAll('text').style('font-size',d=>(Math.min(15,9+Math.sqrt(d.area)/14)/K)+'px').style('stroke-width',(2.5/K)+'px').style('display',d=>d.area*K*K>(W()<600?9000:2600)?null:'none');
  gLakeLab.selectAll('g').style('display',d=>{const m=W()<600;return (d.km2>=(m?200:80)||K*K*d.km2>=(m?400:90))?null:'none'}).call(g=>{g.select('.ln').style('font-size',(12/K)+'px').style('stroke-width',(3/K)+'px');g.select('.la').attr('y',11/K).style('font-size',(9/K)+'px').style('stroke-width',(2.5/K)+'px').style('display',K>=1.5||true?null:'none')});
  gEv.selectAll('g.ev').select('.dot').attr('r',d=>dotR(d));gEv.selectAll('g.ev').select('.ring').attr('r',d=>d.type==='bat'?11*swS(d):dotR(d));

function zoomTo(f){const[[x0,y0],[x1,y1]]=path.bounds(f);const w=W(),h=Hh();const mob=window.innerWidth<900;

  const body=`<div class="facts"><div class="fact"><small>Superficie</small><b>${L.km2.toLocaleString('fr-CH')} km²</b></div><div class="fact"><small>Profondeur max.</small><b>${L.m?L.m+' m':'—'}</b></div></div>
   <p>${L.note||''}</p>${hist?`<div class="sub">Ses noms à travers le temps</div><div class="hist">${hist}</div>`:''}
   ${n?'':`<p class="src">En ${yl}, aucun nom de ce lac ne nous est parvenu.</p>`}`;
  openPanel(L.made?`Lac artificiel · ${L.made}`:'Lac',n||'Lac sans nom connu',body);
}
function openEvent(e){
  panelKind='event';
  const w=e.type==='bat'?WAR[e.title]:null;
  const near=w?EV.filter(x=>x.id!==e.id&&WAR[x.title]&&WAR[x.title][0]===w[0]):EV.filter(x=>x.code===e.code&&x.id!==e.id);
  const body=`<span class="tag"><i style="background:${TYPES[e.type][1]}"></i>${TYPES[e.type][0]} · ${NAMES[e.code]}</span>
   ${w?`<div class="war"><div class="wname">${w[0]}</div><div class="sides"><span>${w[1]}</span><b>contre</b><span>${w[2]}</span></div><div class="win">Vainqueur : <strong>${w[3]}</strong></div></div>`:''}
   <p>${e.text}</p>
   ${near.length?`<div class="sub">${w?'Les autres batailles de cette guerre':'Dans la même région'}</div><div class="evlist">${evButtons(near)}</div>`:''}
   <p class="src">Pour aller plus loin : <a href="https://hls-dhs-dss.ch/fr/search/?text=${encodeURIComponent(e.title.replace(/^(Le |La |L’|Les )/,''))}" target="_blank" rel="noopener">chercher dans le Dictionnaire historique de la Suisse</a></p>`;
  openPanel(e.year<0?`${Math.abs(e.year)} av. J.-C.`:`${e.year}`,e.title,body);bindEvButtons();
}

/* ================= CURSEUR ================= */
const slider=document.getElementById('slider');
document.getElementById('bands').innerHTML=ERAS.map((e,i)=>`<div style="width:${PC[i+1]-PC[i]}%;background:${e.color}"></div>`).join('');
document.getElementById('ticks').innerHTML=EV.filter(e=>e.lvl===1).map(e=>`<i style="left:${posOf(e.year)}%"></i>`).join('');
document.getElementById('eralbl').innerHTML=[[-58,'-58'],[443,'443'],[1291,'1291'],[1515,'1515'],[1798,'1798'],[1848,'1848'],[2026,'2026']].map(([y,t])=>`<span style="left:${Math.min(97,posOf(y))}%">${t}</span>`).join('');
function setYear(y,fromPlay){
  const prev=year;year=Math.max(-15000,Math.min(2026,y));slider.value=Math.round(posOf(year)*100);
  if(fromPlay){const crossed=EV.filter(e=>e.lvl===1&&e.year>prev&&e.year<=year);if(crossed.length)toast(crossed.at(-1))}
  render();
}
slider.addEventListener('input',()=>{stop();year=yearOf(slider.value/100);render()});
let toastT=null;
function toast(e){document.querySelectorAll('.toast').forEach(t=>t.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=`<b>${e.year<0?Math.abs(e.year)+' av. J.-C.':e.year} · ${e.title}</b><span>${NAMES[e.code]}</span>`;host.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2600)}

/* lecture : avance en continu, ralentit sur les événements nationaux */
let pAcc=0,lastT=0,holdUntil=0;
function step(t){if(!playing)return;const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  if(t<holdUntil){raf=requestAnimationFrame(step);return}
  const p=posOf(year)+dt*1.55;const ny=yearOf(Math.min(100,p));
  const hit=EV.find(e=>e.lvl===1&&e.year>year&&e.year<=ny);
  if(hit){setYear(hit.year,true);holdUntil=t+1300}else setYear(ny===year?year+1:ny,true);
  if(year>=2026){stop();return}
  raf=requestAnimationFrame(step)}
function play(){if(year>=2026)setYear(-15000);playing=true;lastT=performance.now();document.getElementById('picon').innerHTML='<rect x="4" y="3" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="10.5" y="3" width="3.5" height="12" rx="1" fill="currentColor"/>';document.getElementById('play').setAttribute('aria-label','Pause');raf=requestAnimationFrame(step)}
function stop(){playing=false;cancelAnimationFrame(raf);document.getElementById('picon').innerHTML='<path d="M5 3l10 6-10 6z" fill="currentColor"/>';document.getElementById('play').setAttribute('aria-label','Lecture')}
document.getElementById('play').onclick=()=>playing?stop():play();
document.addEventListener('keydown',e=>{if(e.target===slider)return;if(e.key===' '){e.preventDefault();playing?stop():play()}if(e.key==='Escape')closePanel()});

addEventListener('resize',()=>{layout();svg.call(zoom.transform,d3.zoomIdentity)});
layout();setYear(1291);
</script>
